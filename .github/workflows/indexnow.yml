name: Submit URLs to IndexNow

# The site is built by the GitHub Pages legacy Jekyll build from main, so there is no
# build step of ours to hook into. On a push to main this job waits until Pages reports
# a finished build of this exact commit, then reads the live sitemap and tells Bing
# which URLs to (re)crawl. Manual runs skip the wait and submit straight away.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: read

concurrency:
  group: indexnow-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  submit:
    name: Submit sitemap URLs
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Wait for the GitHub Pages build of this commit
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Poll for up to 10 minutes. A newer push cancels this run (concurrency group),
          # so a build of a later commit never has to be matched here.
          for _ in $(seq 1 40); do
            read -r status commit < <(gh api "repos/${GITHUB_REPOSITORY}/pages/builds/latest" \
              --jq '"\(.status) \(.commit)"' || echo "unknown none")
            echo "pages build: status=${status} commit=${commit}"
            if [ "$commit" = "$GITHUB_SHA" ] && [ "$status" = "built" ]; then
              echo "Pages build of ${GITHUB_SHA} is done."
              exit 0
            fi
            if [ "$commit" = "$GITHUB_SHA" ] && [ "$status" = "errored" ]; then
              echo "::error::Pages build of ${GITHUB_SHA} errored."
              exit 1
            fi
            sleep 15
          done
          echo "::error::No finished Pages build of ${GITHUB_SHA} after 10 minutes."
          exit 1

      - name: Let the CDN pick up the new build
        if: github.event_name == 'push'
        run: sleep 30

      - name: Submit to IndexNow
        run: node scripts/indexnow-submit.mjs
