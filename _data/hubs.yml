# Category hubs: /formats/, /duckdb/, /use-cases/, /alternatives/, /tools/, /audience/, /privacy/.
# The hub pages (hubs/*.md), the footer "Guides" column, the guide blocks on /app/ and
# /flowscope/, each pSEO page's breadcrumb and its "Related" hub link all read this file.
# A pSEO page appears in its hub by URL prefix; a page listed below gets the label, line and
# group set here, and a new page with no entry is added to the end of the hub's last group
# with its own title and description. "\_" is a no-break space: it keeps short words with
# the next word so no line ends on "a", "to", "and" and the like.

# Pages left out of every hub and link block. Delete a line to list the page again.
exclude:
  - /formats/sqlite-viewer-online/                     # SQLite files are not in the App's supported list yet
  - /tools/data-profiling-tool/                        # Sonar, not in production
  - /tools/column-statistics-tool/                     # Sonar, not in production
  - /use-cases/exploratory-data-analysis-browser/      # Sonar, not in production
  - /tools/cli-duckdb-client/                          # Quack CLI
  - /tools/terminal-sql-client/                        # Quack CLI
  - /formats/csv-to-json-converter/                    # the App has no JSON export
  - /formats/parquet-to-json-converter/                # the App has no JSON export
  - /formats/arrow-feather-viewer/                     # .arrow and .feather are not in the App's supported list
  - /formats/orc-viewer-online/                        # .orc is not in the App's supported list

footer_heading: "Guides"

hubs:
  - path: /formats/
    name: "File formats"          # footer link and breadcrumb
    related_label: "All file format guides"   # link added to each page's "Related" list
    groups:
      - heading: "Stata, SAS and\_SPSS files"
        pages:
          - url: /formats/stata-to-csv-converter/
            label: "Convert Stata .dta to\_CSV"
            text: "Convert a\_Stata .dta file to\_CSV or\_Excel without\_a\_Stata license."
          - url: /formats/open-stata-files-in-browser/
            label: "Open Stata .dta files"
            text: "View a\_Stata .dta file and\_query it with\_SQL when you don't have Stata."
          - url: /formats/open-spss-files-in-browser/
            label: "Open SPSS .sav files"
            text: "Open a\_.sav file online, browse its\_rows and\_query it with\_SQL."
          - url: /formats/spss-to-csv-converter/
            label: "Convert SPSS .sav to\_CSV"
            text: "Convert an\_SPSS .sav file to\_CSV in\_the\_browser."
          - url: /formats/sas-file-viewer-free/
            label: "Free SAS file viewer"
            text: "View a\_.sas7bdat file in\_a\_browser tab, with\_nothing to\_download."
          - url: /formats/open-sas-files-in-browser/
            label: "Open SAS files"
            text: "Open a\_.sas7bdat file and\_query it with\_SQL, without\_a\_SAS license."
          - url: /formats/sas-to-csv-converter/
            label: "Convert SAS to\_CSV"
            text: "Export a\_.sas7bdat file to\_CSV, and\_filter it with\_SQL first if\_you need only part of\_it."
          - url: /formats/sas-to-parquet-converter/
            label: "Convert SAS to\_Parquet"
            text: "Move legacy .sas7bdat data into\_Parquet for\_a\_current data stack."
          - url: /formats/statistical-data-format-converter/
            label: "Statistical format converter"
            text: "One page for\_all three: read SAS, Stata and\_SPSS files and\_export them to\_CSV, Excel or\_Parquet."
      - heading: "Excel, CSV, JSON and\_Parquet files"
        pages:
          - url: /formats/excel-to-csv-converter/
            label: "Convert Excel to\_CSV"
            text: "Each worksheet in\_an\_.xlsx file opens as\_its\_own table, ready to\_export as\_CSV."
          - url: /formats/excel-to-parquet-converter/
            label: "Convert Excel to\_Parquet"
            text: "Convert an\_.xlsx file to\_Parquet and\_fix the\_column types with\_SQL on\_the\_way."
          - url: /formats/csv-to-parquet-converter/
