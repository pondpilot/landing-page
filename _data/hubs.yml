            text: "Convert a\_CSV file to\_typed, compressed Parquet."
          - url: /formats/json-to-csv-converter/
            label: "Convert JSON to\_CSV"
            text: "Flatten nested JSON with\_SQL and\_export a\_flat CSV file."
          - url: /formats/json-to-parquet-converter/
            label: "Convert JSON to\_Parquet"
            text: "Flatten JSON, set the\_column types and\_export Parquet."
          - url: /formats/parquet-viewer-online/
            label: "Parquet viewer online"
            text: "Browse a\_Parquet file's schema, preview its\_rows and\_run SQL on\_it."
      - heading: "Any supported format"
