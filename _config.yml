# GitHub Pages Jekyll configuration
name: PondPilot
description: PondPilot is a family of 100% client-side, DuckDB-powered, open-source data tools. Query, embed, and trace your data in the browser — nothing gets uploaded.
url: "https://pondpilot.io"
baseurl: ""

# Build settings
markdown: kramdown
highlighter: rouge

# Plugins
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

# Permalinks
permalink: /blog/:year/:month/:day/:title/

# Exclude from processing
exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - docker-compose.yml
  - justfile
  - README.md
  - SEO-AUDIT.md
  - USE_CASES.md
  - .gitignore
  - .jekyll-cache
