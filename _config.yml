# GitHub Pages Jekyll configuration
name: PondPilot
description: PondPilot is a family of 100% client-side, DuckDB-powered, open-source data tools. Query, embed, and trace your data in the browser — nothing gets uploaded.
url: "https://pondpilot.io"
baseurl: ""

# Google Tag Manager container ID (GTM-XXXXXXX). The GTM tag, Consent Mode
# defaults, cookie banner and click events render only when this is set AND the
# build runs with JEKYLL_ENV=production (GitHub Pages does). Empty = no tag.
gtm_id: "GTM-53K78LBT"

# pricing.md has no front matter: it is served raw at /pricing.md for AI agents
# (llms.txt links it) and rendered at /pricing/ by GitHub Pages' default
# plugins, which take the page title from its "# Pricing" heading. The page
# layout prints that title as the <h1>, so strip the heading from the rendered
# body; otherwise /pricing/ shows two <h1>s. The raw .md keeps its heading.
titles_from_headings:
  strip_title: true

# Build settings
markdown: kramdown
highlighter: rouge

# Plugins
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

# Permalinks
permalink: /blog/:year/:month/:day/:title/

# Exclude from processing
exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - docker-compose.yml
  - justfile
  - README.md
  - SEO-AUDIT.md
  - USE_CASES.md
  - scripts
  - .gitignore
  - .jekyll-cache
